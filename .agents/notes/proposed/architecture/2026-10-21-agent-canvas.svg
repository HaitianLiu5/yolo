<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 580" width="860" height="580" role="img" aria-labelledby="title desc">
  <title id="title">The agent canvas</title>
  <desc id="desc">Agents place, change, and remove objects through MCP, and read or await events. The Hub, one Durable Object per owner, keeps a canvas per screen and an event log. Screens receive the canvas over the realtime channel and send events back over /v1. Hosts are the player (web and car), Apple TV, desktop, and Android.</desc>
  <style>
    svg { --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --line: #d1d9e0; --box: #f6f8fa; --hub: #eef4ff; --hub-line: #8fb3f5; --accent: #0969da; --chip: #ddf4ff; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --line: #3d444d; --box: #151b23; --hub: #0f1d33; --hub-line: #2f5a9e; --accent: #4493f8; --chip: #12263f; }
    }
    .bg { fill: var(--bg); }
    .box { fill: var(--box); stroke: var(--line); stroke-width: 1.2; }
    .hub { fill: var(--hub); stroke: var(--hub-line); stroke-width: 1.5; }
    .inner { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .chip { fill: var(--chip); stroke: var(--hub-line); stroke-width: 1; }
    .arrow { stroke: var(--accent); stroke-width: 2; fill: none; }
    .head { fill: var(--accent); }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: var(--fg); }
    .title { font-size: 16px; font-weight: 600; }
    .label { font-size: 13px; font-weight: 600; }
    .sub { font-size: 13px; fill: var(--muted); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: var(--muted); }
    .chiptext { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: var(--accent); }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" width="860" height="580"/>

  <!-- Agents -->
  <rect class="box" x="230" y="20" width="400" height="64" rx="10"/>
  <text class="title" x="430" y="46" text-anchor="middle">Agents</text>
  <text class="sub" x="430" y="68" text-anchor="middle">the Ask plugin · Claude · ChatGPT · scripts</text>

  <!-- MCP -->
  <line class="arrow" x1="400" y1="86" x2="400" y2="168" marker-end="url(#head)"/>
  <line class="arrow" x1="460" y1="168" x2="460" y2="86" marker-end="url(#head)"/>
  <text class="label" x="388" y="118" text-anchor="end">MCP: place, change, remove</text>
  <text class="mono" x="388" y="138" text-anchor="end">canvas_put · canvas_patch · canvas_remove · offer</text>
  <text class="label" x="472" y="118">MCP: read and wait</text>
  <text class="mono" x="472" y="138">canvas_read · canvas_events</text>

  <!-- Hub -->
  <rect class="hub" x="40" y="170" width="780" height="190" rx="12"/>
  <text class="title" x="60" y="198">Hub</text>
  <text class="sub" x="98" y="198">one Durable Object per owner, the one authority</text>

  <rect class="inner" x="60" y="214" width="490" height="128" rx="8"/>
  <text class="label" x="76" y="238">A canvas per screen</text>
  <text class="sub" x="76" y="266">surfaces</text>
  <rect class="chip" x="140" y="251" width="62" height="22" rx="11"/>
  <text class="chiptext" x="171" y="266" text-anchor="middle">panel</text>
  <rect class="chip" x="210" y="251" width="66" height="22" rx="11"/>
  <text class="chiptext" x="243" y="266" text-anchor="middle">player</text>
  <rect class="chip" x="284" y="251" width="74" height="22" rx="11"/>
  <text class="chiptext" x="321" y="266" text-anchor="middle">overlay</text>
  <rect class="chip" x="366" y="251" width="88" height="22" rx="11"/>
  <text class="chiptext" x="410" y="266" text-anchor="middle">wallpaper</text>
  <text class="sub" x="76" y="298">objects</text>
  <text class="mono" x="140" y="298">{ id, kind, layout, props, actions, rev }</text>
  <text class="sub" x="76" y="326">put · patch · remove, last writer wins, a rev to catch gaps</text>

  <rect class="inner" x="570" y="214" width="230" height="128" rx="8"/>
  <text class="label" x="586" y="238">Event log</text>
  <text class="sub" x="586" y="266">a cursor per event</text>
  <text class="sub" x="586" y="292">500 events, 24 hours</text>
  <text class="sub" x="586" y="318">read or awaited by agents</text>

  <!-- realtime and /v1 -->
  <line class="arrow" x1="330" y1="362" x2="330" y2="448" marker-end="url(#head)"/>
  <line class="arrow" x1="530" y1="448" x2="530" y2="362" marker-end="url(#head)"/>
  <text class="label" x="318" y="396" text-anchor="end">realtime channel</text>
  <text class="mono" x="318" y="416" text-anchor="end">the canvas in the welcome,</text>
  <text class="mono" x="318" y="432" text-anchor="end">then canvas_ops</text>
  <text class="label" x="542" y="396">/v1 HTTP: what people do</text>
  <text class="mono" x="542" y="416">POST /v1/canvas/events</text>

  <!-- Hosts -->
  <rect class="box" x="40" y="450" width="180" height="76" rx="10"/>
  <text class="title" x="130" y="482" text-anchor="middle">Player</text>
  <text class="sub" x="130" y="506" text-anchor="middle">web · car</text>
  <rect class="box" x="240" y="450" width="180" height="76" rx="10"/>
  <text class="title" x="330" y="482" text-anchor="middle">Apple TV</text>
  <text class="sub" x="330" y="506" text-anchor="middle">SwiftUI</text>
  <rect class="box" x="440" y="450" width="180" height="76" rx="10"/>
  <text class="title" x="530" y="482" text-anchor="middle">Desktop</text>
  <text class="sub" x="530" y="506" text-anchor="middle">wallpaper · overlay</text>
  <rect class="box" x="640" y="450" width="180" height="76" rx="10"/>
  <text class="title" x="730" y="482" text-anchor="middle">Android</text>
  <text class="sub" x="730" y="506" text-anchor="middle">wallpaper · TV</text>

  <text class="sub" x="430" y="558" text-anchor="middle">Each host draws the kinds it knows; any other object shows its fallback.</text>
</svg>
