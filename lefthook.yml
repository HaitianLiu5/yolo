# Git hooks (lefthook). Keep these local checkpoints fast; `npm run check`
# is the full gate, run before a pull request merges. The lefthook npm
# package installs these hooks on `npm install`; `npx lefthook install`
# reinstalls them.

pre-commit:
  jobs:
    - name: translation pairing (staged records)
      glob: '*.i18n.yaml'
      exclude:
        - '.agents/notes/archived/**'
      run: node scripts/verify-translation-pairing.js --cached {staged_files}

    - name: archived agent notes
      glob: '.agents/notes/archived/**'
      run: node scripts/verify-archived-agent-notes.js

    - name: whitespace (staged)
      run: git diff --cached --check

pre-merge-commit:
  jobs:
    - name: translation pairing (staged records)
      glob: '*.i18n.yaml'
      exclude:
        - '.agents/notes/archived/**'
      run: node scripts/verify-translation-pairing.js --cached {staged_files}

    - name: archived agent notes
      glob: '.agents/notes/archived/**'
      run: node scripts/verify-archived-agent-notes.js

pre-push:
  jobs:
    # The archive's seals are compared with where the branch left origin/main:
    # against HEAD, the default, a committed change to a sealed note compares
    # the archive with itself. Without origin/main the default stays.
    - name: documentation gates
      run: base=$(git merge-base origin/main HEAD 2>/dev/null) && export YOLO_ARCHIVE_BASE_REF="$base"; npm run doc-sync
