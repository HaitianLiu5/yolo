name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What feature would you like and why?
    validations:
      required: true
  - type: dropdown
    id: workspace
    attributes:
      label: Affected workspace
      options:
        - the player (clients/tesla)
        - control plane (service/control)
        - media node (service/node)
        - core or plugin API (service/core, service/plugin-api)
        - source plugins (plugins/)
        - documentation or Agent Notes
        - multiple
        - unsure
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Have you tried any workarounds?
