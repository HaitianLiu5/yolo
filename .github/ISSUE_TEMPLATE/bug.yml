name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: dropdown
    id: workspace
    attributes:
      label: Affected workspace
      options:
        - the player (clients/player)
        - control plane (service/control)
        - media node (service/node)
        - core or plugin API (service/core, service/plugin-api)
        - source plugins (plugins/)
        - documentation or Agent Notes
        - multiple
    validations:
      required: true
  - type: dropdown
    id: screen
    attributes:
      label: Where it happened
      options:
        - a Tesla (car mode, canvas engine)
        - another browser (web mode, <video> engine)
        - an agent over MCP
        - not about a screen
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the issue
      placeholder: |
        1. Ask the agent to play <URL or title>
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error logs
      description: The media node's log lines and the browser console around the failure; remove tokens and signed URLs first
      render: shell
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js version, tool versions, and the browser or car software version
      placeholder: |
        OS: <name and version>
        Browser or car software: <version>
        Node: <node --version>
        yt-dlp: <yt-dlp --version>
        ffmpeg: <ffmpeg -version>
    validations:
      required: true
