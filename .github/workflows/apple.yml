name: Apple

# The native Apple apps build only on macOS, so `npm run check` never
# compiles them (Agent Notes 2026-10-19-apple-tv-client and
# 2026-10-23-iphone-and-ipad-client, Risks). This job runs YoloKit's protocol
# tests and builds the tvOS and iOS apps, unsigned, whenever the Apple
# clients change.
on:
  push:
    branches: [main]
    paths: ["clients/apple/**", ".github/workflows/apple.yml"]
  pull_request:
    branches: [main]
    paths: ["clients/apple/**", ".github/workflows/apple.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tvos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Protocol tests
        run: swift test --package-path clients/apple/YoloKit

      - name: Build the tvOS app
        run: >
          xcodebuild -project clients/apple/Yolo.xcodeproj -scheme YoloTV
          -destination 'generic/platform=tvOS Simulator'
          CODE_SIGNING_ALLOWED=NO build

      - name: Build the iOS app
        run: >
          xcodebuild -project clients/apple/Yolo.xcodeproj -scheme YoloiOS
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
