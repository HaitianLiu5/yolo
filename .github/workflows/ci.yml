name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Test and build
        run: npm run check:core

      - name: Verify the Tesla client build
        run: test -f clients/tesla/dist/index.html && test -f clients/tesla/dist/diag.html && test -f clients/tesla/dist/_headers

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.0
          cache: npm

      - run: npm ci

      - name: Install browser and media dependencies
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install --yes ffmpeg

      - name: Build the Tesla client
        run: npm run build -w clients/tesla

      - name: Run product E2E tests (node + wrangler dev --local + Chromium)
        run: npm run test:e2e
