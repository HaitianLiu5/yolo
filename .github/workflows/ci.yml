name: CI

# The build, unit, and integration tests on the oldest and newest Node Yolo
# supports. A change that touches only documentation skips them; the Docs
# workflow's gates check it. The skills test reads every SKILL.md and the
# versions test CHANGELOG.md, so those two still run it.
on:
  push:
    branches: [main]
    paths: &code
      - "**"
      - "!**/*.md"
      - "!**/*.i18n.yaml"
      - "!.agents/notes/**"
      - "!.github/readme/**"
      - "!.github/workflows/docs.yml"
      - "!.github/workflows/apple.yml"
      - "!.github/workflows/claude.yml"
      - "!clients/apple/**"
      - "!test/conformance/**"
      - "CHANGELOG.md"
      - "**/SKILL.md"
  pull_request:
    branches: [main]
    paths: *code
  # A branch's CI by hand, without a pull request: gh workflow run CI --ref <branch>
  workflow_dispatch:

# A pull request's newer push cancels its older run; every commit on main
# runs in full, since releases are tagged there.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-node
        with:
          node-version: ${{ matrix.node-version }}

      - name: Build
        run: npm run build

      - name: Verify the player build
        run: test -f clients/player/dist/index.html && test -f clients/player/dist/diag.html && test -f clients/player/dist/_headers

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration
