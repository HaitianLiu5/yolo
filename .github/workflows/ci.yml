name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A branch's CI by hand, without a pull request: gh workflow run CI --ref <branch>
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      # Full history, so the archived-notes gate can read the pull request's
      # base commit and reject any change to a sealed note.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Documentation gates, test, and build
        env:
          YOLO_ARCHIVE_BASE_REF: ${{ github.event.pull_request.base.sha || 'HEAD' }}
        run: npm run check:core

      - name: Verify the player build
        run: test -f clients/player/dist/index.html && test -f clients/player/dist/diag.html && test -f clients/player/dist/_headers
