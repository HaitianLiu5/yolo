name: E2E

# The whole stack (node, wrangler dev --local, Chrome) for every change that
# can reach it. Documentation, the documentation gates, skills, the Apple
# clients, and the other workflows cannot, so a push or pull request that
# changes only those skips this workflow; CI's doc-sync and unit tests still
# run (Agent Note 2026-07-21-test-layers).
on:
  push:
    branches: [main]
    paths-ignore: &not-the-stack
      - "**/*.md"
      - "**/*.i18n.yaml"
      - ".agents/**"
      - ".claude/**"
      - "skills/**"
      - "scripts/**"
      - "clients/apple/**"
      - "test/conformance/**"
      - ".github/readme/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/apple.yml"
      - ".github/workflows/claude.yml"
      - "lefthook.yml"
  pull_request:
    branches: [main]
    paths-ignore: *not-the-stack
  # By hand, without a pull request: gh workflow run E2E --ref <branch>
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Each test file starts its own stack on free ports, so the files run on
  # runners of their own, and a new file gets one without editing this.
  files:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: echo "list=$(ls test/e2e/*.test.js | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  e2e:
    needs: files
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.files.outputs.list) }}
    name: e2e (${{ matrix.file }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: npm

      - run: npm ci

      # The runner's own Google Chrome decodes H.264, so Playwright downloads
      # no browser and installs none of its system packages. ffmpeg is one
      # static binary from a pinned release, checked by its hash, instead of
      # apt, whose mirror has held this step for 8 minutes and more.
      - name: Install ffmpeg
        timeout-minutes: 3
        env:
          FFMPEG_URL: https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-linux-x64.gz
          FFMPEG_SHA256: bfe8a8fc511530457b528c48d77b5737527b504a3797a9bc4866aeca69c2dffa
        run: |
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/ffmpeg.gz" "$FFMPEG_URL"
          echo "$FFMPEG_SHA256  $RUNNER_TEMP/ffmpeg.gz" | sha256sum -c -
          gunzip -c "$RUNNER_TEMP/ffmpeg.gz" > "$RUNNER_TEMP/ffmpeg/ffmpeg"
          chmod +x "$RUNNER_TEMP/ffmpeg/ffmpeg"
          echo "$RUNNER_TEMP/ffmpeg" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ffmpeg/ffmpeg" -hide_banner -version | head -1

      - name: Diagnose the live audio read (temporary)
        if: contains(matrix.file, 'ai-subtitles')
        run: |
          d=$(mktemp -d); mkdir "$d/hls"
          ffmpeg -hide_banner -loglevel error -f lavfi -i sine=frequency=440:duration=30 -c:a aac -f hls -hls_time 5 -hls_segment_filename "$d/hls/seg%d.ts" "$d/hls/live.m3u8"
          cat "$d/hls/live.m3u8"; ls -l "$d/hls"
          cat "$d/hls/seg0.ts" "$d/hls/seg1.ts" "$d/hls/seg2.ts" | ffmpeg -hide_banner -loglevel error -nostdin -i pipe:0 -map 0:a:0 -vn -sn -dn -ac 1 -ar 16000 -c:a pcm_s16le -f wav pipe:1 > "$d/out.wav"; echo "exit=$? bytes=$(stat -c %s "$d/out.wav")"
          cat "$d/hls/seg0.ts" "$d/hls/seg1.ts" "$d/hls/seg2.ts" | ffmpeg -hide_banner -loglevel info -i pipe:0 -f null - 2>&1 | tail -15

      - name: Build the player
        run: npm run build -w clients/player

      - name: Run the file's journeys (node + wrangler dev --local + Chrome)
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
        run: node --test --test-concurrency=1 "${{ matrix.file }}"
