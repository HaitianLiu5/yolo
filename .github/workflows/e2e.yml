name: E2E

# The whole stack (node, wrangler dev --local, Chrome) for every change that
# can reach it. Documentation, the documentation gates, skills, the Apple
# clients, and the other workflows cannot, so a push or pull request that
# changes only those skips this workflow; CI's doc-sync and unit tests still
# run (Agent Note 2026-07-21-test-layers).
on:
  push:
    branches: [main]
    paths-ignore: &not-the-stack
      - "**/*.md"
      - "**/*.i18n.yaml"
      - ".agents/**"
      - ".claude/**"
      - "skills/**"
      - "scripts/**"
      - "clients/apple/**"
      - "test/conformance/**"
      - ".github/readme/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/apple.yml"
      - ".github/workflows/claude.yml"
      - "lefthook.yml"
  pull_request:
    branches: [main]
    paths-ignore: *not-the-stack
  # By hand, without a pull request: gh workflow run E2E --ref <branch>
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Each test file starts its own stack on free ports, so the files run on
  # runners of their own, and a new file gets one without editing this.
  files:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: echo "list=$(ls test/e2e/*.test.js | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  e2e:
    needs: files
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.files.outputs.list) }}
    name: e2e (${{ matrix.file }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: npm

      - run: npm ci

      # The runner's own Google Chrome decodes H.264, so Playwright downloads
      # no browser and installs none of its system packages. ffmpeg is
      # Ubuntu's, as the image's dependencies expect (a static build crashed
      # reading piped audio), and its packages are cached per runner image:
      # only the first run on a new image waits on apt's mirror, which has
      # held this step for 8 minutes and more.
      - name: Name the runner image
        id: image
        run: echo "version=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"

      - name: Restore ffmpeg's packages
        id: ffmpeg-debs
        uses: actions/cache@v6
        with:
          path: ~/ffmpeg-debs
          key: ffmpeg-debs-${{ steps.image.outputs.version }}

      - name: Install ffmpeg
        timeout-minutes: 8
        env:
          CACHED: ${{ steps.ffmpeg-debs.outputs.cache-hit }}
        run: |
          if [ "$CACHED" != true ]; then
            mkdir -p ~/ffmpeg-debs/partial
            sudo apt-get update -o Acquire::Retries=3
            sudo apt-get install --yes --download-only --no-install-recommends -o Acquire::Retries=3 -o Dir::Cache::archives="$HOME/ffmpeg-debs" ffmpeg
            sudo rm -rf ~/ffmpeg-debs/partial ~/ffmpeg-debs/lock
          fi
          sudo dpkg -i ~/ffmpeg-debs/*.deb > /dev/null
          ffmpeg -hide_banner -version | head -1

      - name: Build the player
        run: npm run build -w clients/player

      - name: Run the file's journeys (node + wrangler dev --local + Chrome)
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
        run: node --test --test-concurrency=1 "${{ matrix.file }}"
