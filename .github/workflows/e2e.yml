name: E2E

# The whole stack (node, wrangler dev --local, Chrome) for every change that
# can reach it. Documentation, the documentation gates, skills, unit and
# integration tests, the Apple clients, the website, and the other workflows
# cannot, so a push or pull request that changes only those skips this
# workflow; CI and Docs still run (Agent Note 2026-07-21-test-layers).
on:
  push:
    branches: [main]
    paths-ignore: &not-the-stack
      - "**/*.md"
      - "**/*.i18n.yaml"
      - ".agents/**"
      - ".claude/**"
      - "skills/**"
      - "scripts/**"
      - "ops/test/**"
      - "*/*/test/unit/**"
      - "*/*/test/integration/**"
      - "plugins/*/test/**"
      - "clients/apple/**"
      - "test/conformance/**"
      - "site/**"
      - ".github/readme/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/docs.yml"
      - ".github/workflows/apple.yml"
      - ".github/workflows/claude.yml"
      - "lefthook.yml"
  pull_request:
    branches: [main]
    paths-ignore: *not-the-stack
  # By hand, without a pull request: gh workflow run E2E --ref <branch>
  workflow_dispatch:

# A pull request's newer push cancels its older run; every commit on main
# runs in full, since releases are tagged there.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Each test file starts its own stack on free ports, so the files run on
  # runners of their own at once. The list is written out, slowest first so
  # they get runners first, rather than read by a job the rest would wait
  # on; scripts/e2e-workflow.test.js fails when it misses a file.
  e2e:
    strategy:
      fail-fast: false
      matrix:
        file:
          - quality-step-up
          - car-playback
          - web-playback
          - media-paths
          - agent-canvas-tv
          - ask-voice
          - ai-subtitles
          - home-setup
          - home-feed
          - agent-canvas
    name: e2e (${{ matrix.file }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The runner's own Google Chrome decodes H.264, so Playwright downloads
      # no browser and installs none of its system packages. ffmpeg is
      # Ubuntu's, as the image's dependencies expect (a static build crashed
      # reading piped audio), and its packages are cached per runner image:
      # apt's mirror has held a download for 8 minutes and more, so only a
      # runner on an image no job has cached yet waits on it.
      - name: Name the runner image
        id: image
        run: echo "version=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"

      - name: Restore ffmpeg's packages
        id: ffmpeg-debs
        uses: actions/cache/restore@v6
        with:
          path: ~/ffmpeg-debs
          key: ffmpeg-debs-${{ steps.image.outputs.version }}

      - name: Download ffmpeg's packages
        if: steps.ffmpeg-debs.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: |
          mkdir -p ~/ffmpeg-debs/partial
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install --yes --download-only --no-install-recommends -o Acquire::Retries=3 -o Dir::Cache::archives="$HOME/ffmpeg-debs" ffmpeg
          sudo rm -rf ~/ffmpeg-debs/partial ~/ffmpeg-debs/lock
          sudo chown -R "$USER" ~/ffmpeg-debs

      - name: Save ffmpeg's packages
        if: steps.ffmpeg-debs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/ffmpeg-debs
          key: ffmpeg-debs-${{ steps.image.outputs.version }}

      # dpkg takes about 8 seconds, so it runs in the background while Node
      # and node_modules arrive; the step before the journeys waits for it.
      # It skips man-db's trigger, which rebuilds the image's manual index,
      # and fsync per file: the runner is thrown away after. Its output goes
      # to a file, or the runner would hold the step open until it ends.
      - name: Start installing ffmpeg
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          nohup sh -c 'sudo dpkg -i --force-unsafe-io "$HOME"/ffmpeg-debs/*.deb > "$HOME/ffmpeg-install.log" 2>&1; echo $? > "$HOME/ffmpeg-install.status"' > /dev/null 2>&1 < /dev/null &

      # The runner's own Node 22, which the image caches.
      - uses: ./.github/actions/setup-node
        with:
          node-version: 22

      - name: Build the player
        run: npm run build -w clients/player

      - name: Wait for ffmpeg
        timeout-minutes: 5
        run: |
          while [ ! -f ~/ffmpeg-install.status ]; do sleep 1; done
          [ "$(cat ~/ffmpeg-install.status)" = 0 ] || { cat ~/ffmpeg-install.log; exit 1; }
          ffmpeg -hide_banner -version | head -1

      - name: Run the file's journeys (node + wrangler dev --local + Chrome)
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
        run: node --test --test-concurrency=1 "test/e2e/${{ matrix.file }}.test.js"
